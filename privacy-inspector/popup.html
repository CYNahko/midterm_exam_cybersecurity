<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Privacy Inspector</title>
</head>
<body>
  <h1>Privacy Inspector</h1>

  <p id="status">Carregando análise...</p>

  <section id="report" hidden>
    <p>
      Página:
      <strong id="page-domain"></strong>
    </p>

    <p>
      Domínios de terceiros únicos:
      <strong id="domain-count">0</strong>
    </p>

    <ul id="domain-list"></ul>

    <h2>Armazenamento HTML5</h2>

    <ul>
      <li>
        localStorage:
        <strong id="local-storage-count">0</strong> itens
      </li>

      <li>
        sessionStorage:
        <strong id="session-storage-count">0</strong> itens
      </li>

      <li>
        IndexedDB:
        <strong id="indexed-db-count">0</strong> bancos
      </li>
    </ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
